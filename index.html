<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07162e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>TengHisob</title>
<style>
:root{--g:#7158e2;--bg:#f4f5fb;--txt:#202442;--muted:#6b6f8d;--line:#e9eaf4}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--txt);font-size:15px;line-height:1.55}
header{position:relative;overflow:hidden;background:linear-gradient(140deg,#292650 0%,#5140a9 58%,#7259e8 100%);color:#fff;padding:20px 20px 42px;padding-top:max(20px,env(safe-area-inset-top));border-radius:0 0 30px 30px;box-shadow:0 12px 35px #37306a30}
header:before{content:"";position:absolute;width:240px;height:240px;right:-85px;top:-120px;border:38px solid #ffffff10;border-radius:50%;pointer-events:none}
header:after{content:"";position:absolute;width:140px;height:140px;right:100px;bottom:-105px;background:#ffffff0b;border-radius:50%;pointer-events:none}
header h1{position:relative;z-index:1;margin:15px 0 3px;font-size:32px;font-weight:850;letter-spacing:-1.2px}
header p{position:relative;z-index:1;margin:0;color:#e3e0ff;font-size:13px}
.langbox{position:relative;z-index:2;display:flex;justify-content:flex-end;align-items:center;gap:9px}
.langbox label{margin:0;color:#e3e0ff;font-size:12px;font-weight:700}
.langbox select{width:auto;min-width:122px;min-height:40px;padding:9px 12px;border:1px solid #ffffff35;border-radius:12px;background:#ffffff15;color:#fff;font-size:13px}
.langbox select option{background:#fff;color:#202442}
main{width:100%;max-width:760px;margin:-18px auto 0;padding:0 14px 40px;padding-bottom:calc(40px + env(safe-area-inset-bottom));position:relative;z-index:3}
.card{background:#fff;padding:20px;margin-bottom:15px;border:1px solid #ebebf5;border-radius:23px;box-shadow:0 8px 28px #2926500a}
h2{margin:0 0 18px;font-size:21px;line-height:1.35;font-weight:850;letter-spacing:-.45px}
label{display:block;margin:14px 0 7px;color:#626782;font-size:13px;font-weight:750}
input,select,textarea{display:block;width:100%;min-height:49px;padding:13px 14px;border:1px solid #e2e4f0;border-radius:14px;outline:none;background:#f9f9fd;color:var(--txt);font:inherit;font-size:15px;transition:border-color .2s,box-shadow .2s,background .2s}
input:focus,select:focus,textarea:focus{border-color:var(--g);background:#fff;box-shadow:0 0 0 4px #7158e21a}
input::placeholder,textarea::placeholder{color:#8e91a8}
textarea{min-height:80px;resize:vertical}
button{min-height:45px;padding:12px 15px;border:0;border-radius:14px;font-family:inherit;font-size:14px;font-weight:750;line-height:1.4;cursor:pointer;transition:transform .15s,filter .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.98)}
button:disabled{opacity:.55;cursor:not-allowed}
.primary{width:100%;margin-top:14px;background:linear-gradient(135deg,#7962eb,#5842c5);color:#fff;box-shadow:0 7px 17px #7158e22e}
.primary:active{box-shadow:none}
.secondary{background:#efedff;color:#5b48c7}
.danger{background:#fff0f2;color:#d84460}
.good{background:#e7f8ef;color:#18865a}
.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.nav button{position:relative;min-height:82px;padding:16px 13px;border:1px solid #e9e7fb;border-radius:18px;background:linear-gradient(145deg,#fff,#f5f3ff);color:#49417e;text-align:left;font-size:14px;overflow-wrap:anywhere;box-shadow:0 4px 12px #35306a08}
.nav button:before{content:"";display:block;width:25px;height:4px;margin-bottom:12px;border-radius:10px;background:linear-gradient(90deg,#7962eb,#36c9a0)}
.nav button:active{background:#eeebff}
.row{display:flex;align-items:flex-end;gap:10px}
.row>*{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.stat{min-width:0;min-height:105px;padding:15px 14px;border:1px solid #e9e8f6;border-radius:18px;background:linear-gradient(145deg,#fbfaff,#f1efff)}
.stat span{display:block;color:#666a88;font-size:12px;font-weight:700;line-height:1.5}
.stat b{display:block;margin-top:10px;color:#5b48c7;font-size:clamp(16px,4.5vw,22px);font-weight:850;line-height:1.35;overflow-wrap:anywhere}
.item{padding:16px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.item:last-child{border-bottom:0}
.item b{color:#292b4b}
.item>div{margin-top:6px}
.item button{margin-top:11px}
.item .tag{margin-top:9px}
.small{color:var(--muted);font-size:12px;line-height:1.65}
.hidden{display:none!important}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.topline .small{margin-bottom:3px}
.topline b{overflow-wrap:anywhere}
.notice{padding:14px 16px;border:1px solid #e5ddff;border-radius:15px;background:#f6f3ff;color:#5a4b9a;font-size:13px;line-height:1.65;overflow-wrap:anywhere}
.tag{display:inline-block;max-width:100%;padding:7px 11px;border:1px solid #e6e3fa;border-radius:10px;background:#f3f1ff;color:#5c4bc0;font-size:12px;font-weight:750;overflow-wrap:anywhere}
.tag.red{background:#fff0f2;border-color:#f7d9df;color:#d84460}
a.btn{display:flex;align-items:center;justify-content:center;min-height:45px;margin-top:11px;border-radius:14px;font-size:14px;font-weight:750;text-decoration:none}
#authTitle{margin-bottom:12px}
#auth .primary{min-height:51px}
#auth .secondary{width:100%;margin-top:10px}
#authMsg{overflow-wrap:anywhere}
#shopName+button{margin-top:10px}
#shop>.secondary,.page>.secondary,[id$="List"]>.secondary{width:100%;margin-top:16px}
.page .primary{margin-bottom:8px}
#buyerDebtsList .item .row{align-items:stretch;margin-top:10px}
#buyerDebtsList .row button{margin-top:0}
#buyerDebtsList textarea{margin-bottom:12px}
#reportContent .stats{margin-top:5px}
#app>.card:first-child{border-radius:18px}
#app>.card:first-child .danger{flex-shrink:0}
#shop .stats .stat:nth-child(2){background:linear-gradient(145deg,#fffafa,#fff0f2);border-color:#f7e5e9}
#shop .stats .stat:nth-child(2) b{color:#d84460}
#shop .stats .stat:nth-child(3){background:linear-gradient(145deg,#fffaf1,#fff4df);border-color:#f4e8d0}
#shop .stats .stat:nth-child(3) b{color:#a06d1c}
#shop .stats .stat:nth-child(4){background:linear-gradient(145deg,#f3fffa,#e7f9f0);border-color:#dff2e8}
#shop .stats .stat:nth-child(4) b{color:#18865a}
.page h2{padding-bottom:13px;border-bottom:1px solid #efeff7}
#status{margin-top:15px}
button:focus-visible,a.btn:focus-visible{outline:3px solid #a99bff;outline-offset:2px}
@media(max-width:380px){main{padding-left:10px;padding-right:10px}.card{padding:16px;border-radius:19px}.nav{gap:8px}.nav button{padding:12px 10px;min-height:75px;font-size:13px}.stats{gap:8px}.stat{padding:12px 10px;min-height:95px}.row{gap:7px}header{padding-left:16px;padding-right:16px}header h1{font-size:29px}}
@media(min-width:600px){header{padding-left:max(24px,calc((100% - 712px)/2));padding-right:max(24px,calc((100% - 712px)/2))}main{padding-bottom:50px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
<div class="langbox"><label for="languageSelect">Til / Язык</label>
<select id="languageSelect" onchange="changeLanguage(this.value)"><option value="uz">O‘zbekcha</option><option value="ru">Русский</option></select></div>
<h1>TengHisob</h1>
<p data-i="sub"></p>
</header>
<main>
<section id="auth" class="card">
<h2 id="authTitle" data-i="login"></h2>
<div id="signupBox" class="hidden">
<label data-i="fullName"></label><input id="fullName" data-p="namePh" autocomplete="name">
<label data-i="phone"></label><input id="phone" type="tel" placeholder="+998...">
<label data-i="role"></label>
<select id="role"><option value="shop" data-i="shopOwner"></option><option value="buyer" data-i="buyer"></option></select>
</div>
<label data-i="email"></label><input id="email" type="email" autocomplete="email">
<label data-i="pass"></label><input id="password" type="password" autocomplete="current-password">
<button class="primary" id="authBtn" onclick="authenticate()" data-i="signin"></button>
<button class="secondary" id="switchBtn" onclick="toggleAuth()" data-i="signup"></button>
<button class="secondary" onclick="forgot()" data-i="forgot"></button>
<p id="authMsg" class="small"></p>
</section>

<section id="reset" class="card hidden"><h2 data-i="newPass"></h2><label data-i="pass"></label><input id="newPassword" type="password" autocomplete="new-password"><button class="primary" onclick="savePass()" data-i="savePass"></button><p id="resetMsg" class="small"></p></section>
<section id="app" class="hidden">
<div class="card topline"><div><div class="small" data-i="account"></div><b id="userLabel"></b></div>
<button class="danger" onclick="logout()" data-i="logout"></button></div>

<section id="shop" class="card page hidden">
<h2 data-i="shopOwner"></h2>
<label data-i="shopName"></label><input id="shopName">
<button class="secondary" onclick="saveShopName()" data-i="saveShop"></button>
<div class="stats">
<div class="stat"><span data-i="totSales"></span><b id="totalSales"></b></div>
<div class="stat"><span data-i="expenses"></span><b id="totalExpenses"></b></div>
<div class="stat"><span data-i="debtLeft"></span><b id="totalDebt"></b></div>
<div class="stat"><span data-i="paidDebt"></span><b id="totalPaid"></b></div>
</div>
<div class="nav">
<button onclick="openPage('sales')" data-i="sales"></button>
<button onclick="openPage('expenses')" data-i="expenses"></button>
<button onclick="openPage('products')" data-i="products"></button>
<button onclick="openPage('debts')" data-i="debts"></button>
<button onclick="openPage('payments')" data-i="payments"></button>
<button onclick="openPage('reports')" data-i="reports"></button>
<button onclick="openPage('customers')" data-i="customers"></button>
</div>
</section>

<section id="sales" class="card page hidden">
<h2 data-i="addSale"></h2>
<label data-i="product"></label><select id="saleProduct" onchange="pickProduct()"></select>
<label data-i="qty"></label><input id="saleQty" type="number" min="0" step="any" value="1" inputmode="decimal" oninput="pickProduct()">
<label data-i="saleName"></label><input id="saleName" data-p="eg">
<label data-i="amount"></label><input id="saleAmount" type="number" min="1" step="1" inputmode="numeric">
<label data-i="payType"></label>
<select id="saleType" onchange="$('saleDebt').classList.toggle('hidden',this.value!=='qarz')">
<option value="naqd" data-i="cash"></option><option value="karta" data-i="card"></option><option value="qarz" data-i="credit"></option></select>
<div id="saleDebt" class="hidden">
<label data-i="buyerName"></label><input id="saleBuyer">
<label data-i="phone"></label><input id="salePhone" type="tel" placeholder="+998...">
</div>
<button class="primary" onclick="addSale()" data-i="saveSale"></button>
<input data-s="salesList" data-p="search" oninput="renderAll()" style="margin-top:14px">
<div id="salesList"></div>
<button class="secondary" onclick="openPage('shop')" data-i="back"></button>
</section>

<section id="expenses" class="card page hidden">
<h2 data-i="expense"></h2>
<label data-i="expName"></label><input id="expenseName">
<label data-i="amount"></label><input id="expenseAmount" type="number" min="1" step="1" inputmode="numeric">
<button class="primary" onclick="addExpense()" data-i="saveExp"></button>
<div id="expensesList"></div>
<button class="secondary" onclick="openPage('shop')" data-i="back"></button>
</section>

<section id="products" class="card page hidden">
<h2 data-i="products"></h2>
<label data-i="prodName"></label><input id="productName">
<div class="row">
<div><label data-i="cost"></label><input id="productCost" type="number" min="0" step="1" inputmode="numeric"></div>
<div><label data-i="price"></label><input id="productPrice" type="number" min="1" step="1" inputmode="numeric"></div>
</div>
<label data-i="qty"></label><input id="productQty" type="number" min="0" step="any" inputmode="decimal">
<button class="primary" onclick="addProduct()" data-i="saveProd"></button>
<input data-s="productsList" data-p="search" oninput="renderAll()" style="margin-top:14px">
<div id="productsList"></div>
<button class="secondary" onclick="openPage('shop')" data-i="back"></button>
</section>

<section id="debts" class="card page hidden">
<h2 data-i="debtTitle"></h2>
<label data-i="buyerName"></label><input id="debtBuyer">
<label data-i="phone"></label><input id="debtPhone" type="tel" placeholder="+998...">
<label data-i="debtAmt"></label><input id="debtAmount" type="number" min="1" step="1" inputmode="numeric">
<label data-i="due"></label><input id="debtDate" type="date">
<label data-i="note"></label><input id="debtNote">
<button class="primary" onclick="addDebt()" data-i="saveDebt"></button>
<input data-s="debtsList" data-p="search" oninput="renderAll()" style="margin-top:14px">
<div id="debtsList"></div>
<button class="secondary" onclick="openPage('shop')" data-i="back"></button>
</section>

<section id="payments" class="card page hidden">
<h2 data-i="payTitle"></h2>
<label data-i="debt"></label><select id="paymentDebt"></select>
<label data-i="paidAmt"></label><input id="paymentAmount" type="number" min="1" step="1" inputmode="numeric">
<button class="primary" onclick="addPayment()" data-i="savePay"></button>
<div id="paymentsList"></div>
<button class="secondary" onclick="openPage('shop')" data-i="back"></button>
</section>

<section id="reports" class="card page hidden">
<h2 data-i="reports"></h2>
<select id="repRange" onchange="renderReports()"><option value="1" data-i="rToday"></option><option value="7" data-i="r7"></option><option value="30" data-i="r30"></option><option value="0" data-i="rAll" selected></option></select>
<div id="reportContent"></div>
<button class="primary" onclick="exportCSV()" data-i="exportCsv"></button>
<button class="secondary" onclick="openPage('shop')" data-i="back"></button>
</section>

<section id="customers" class="card page hidden"><h2 data-i="customers"></h2><div id="customersList"></div><button class="secondary" onclick="openPage('shop')" data-i="back"></button></section>

<section id="buyer" class="card page hidden">
<h2 data-i="buyer"></h2>
<p class="small" data-i="buyerInfo"></p>
<button class="primary" onclick="loadBuyerDebts()" data-i="refresh"></button>
<label data-i="codeIn"></label><div class="row"><input id="claimCode" autocapitalize="characters"><button class="good" onclick="claimCode()" data-i="addByCode"></button></div>
<div id="buyerDebtsList"></div>
</section>

<div id="status" class="notice" data-i="loading"></div>
</section>
</main>

const t=k=>(L[k]||[k,k])[lang==='ru'?1:0];
const loc=()=>lang==='ru'?'ru-RU':'uz-UZ';
const money=n=>(Number(n)||0).toLocaleString(loc(),{maximumFractionDigits:2})+(lang==='ru'?' сум':' so‘m');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Telefon: faqat raqamlar, +998 formatiga keltiriladi */
const ph=p=>{let d=(p||'').replace(/\D/g,'');if(d.length===9)d='998'+d;if(d.length===11&&d[0]==='8')d='7'+d.slice(1);return d?'+'+d:''};
const eT=e=>{const m=e.message||String(e);return /invalid login/i.test(m)?t('badLogin'):/already registered/i.test(m)?t('exists'):/rate limit|too many/i.test(m)?t('rate'):m};

function tr(){
 document.documentElement.lang=lang;
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i)+(e.dataset.x||''));
 document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));
 $('languageSelect').value=lang;
}
function msg(id,k,x){$(id).dataset.i=k;$(id).dataset.x=x||'';tr()}
const say=(k,x)=>msg('status',k,x);
function changeLanguage(v){
 lang=v==='ru'?'ru':'uz';localStorage.setItem('tenghisob_language',lang);tr();
 if(user){setLabel();renderAll();if(!$('buyer').classList.contains('hidden'))loadBuyerDebts()}
}
const setLabel=()=>$('userLabel').textContent=(profile.full_name||user.email)+' · '+t(profile.role==='shop'?'shopOwner':'buyer');
const run=async f=>{try{await f()}catch(e){alert(t('err')+eT(e))}};

function toggleAuth(){
 mode=!mode;$('signupBox').classList.toggle('hidden',!mode);
 $('authTitle').dataset.i=mode?'signup':'login';
 $('authBtn').dataset.i=mode?'register':'signin';
 $('switchBtn').dataset.i=mode?'haveAcc':'signup';
 $('password').autocomplete=mode?'new-password':'current-password';
 msg('authMsg','');
}
async function authenticate(){
 const email=val('email'),password=$('password').value;
 if(!email||password.length<6)return msg('authMsg','needEmail');
 $('authBtn').disabled=true;msg('authMsg','checking');
 try{
  let res;
  if(mode){
   if(!val('fullName'))return msg('authMsg','needName');
   res=await db.auth.signUp({email,password,options:{data:{full_name:val('fullName'),phone:ph(val('phone')),role:$('role').value}}});
  }else res=await db.auth.signInWithPassword({email,password});
  if(res.error)throw res.error;
  if(!res.data.session)return msg('authMsg','noSession');
  user=res.data.user;msg('authMsg','');
  await startApp();
 }catch(e){msg('authMsg','err',eT(e))}
 finally{$('authBtn').disabled=false}
}

}
function showReset(){recovering=true;$('auth').classList.add('hidden');$('reset').classList.remove('hidden')}

 const {error}=await db.auth.updateUser({password:p});

  :`Hurmatli ${name}, “${sn}” do‘konidagi qarzingiz: ${money(left)}.${due?' Muddat: '+due+'.':''}${code?' Ilovadagi kod: '+code:''}`);

const editItem=(kind,id)=>run(async()=>{
 const x=data[kind].find(i=>i.id===id),isP=kind==='products',isD=kind==='debts';

 const e=isD?(await db.rpc('edit_debt',{p_id:id,p_amount:v,p_note:nm.trim()})).error
  :(await db.from(kind).update(isP?{name:nm.trim(),sale_price:v}:{name:nm.trim(),amount:v}).eq('id',id).eq('shop_id',shop.id)).error;

});

function exportCSV(){
 const q=v=>{let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
 const R=[['turi','nomi','summa','izoh','sana']];
 data.sales.forEach(x=>R.push(['savdo',x.name,x.amount,x.type,x.date]));
 data.expenses.forEach(x=>R.push(['xarajat',x.title,x.amount,'',x.date]));
 data.debts.forEach(x=>R.push(['qarz',x.buyer,x.amount,'tolangan '+paidFor(x.id)+'; muddat '+x.due,'']));
 data.payments.forEach(x=>R.push(['tolov',(data.debts.find(d=>d.id===x.debtId)||{}).buyer||'',x.amount,'',x.date]));
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob(['\ufeff'+R.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));
 a.download='tenghisob.csv';a.click();
}
async function startApp(){
 const {data:p,error:pe}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();
 if(pe)throw pe;
 const m=user.user_metadata||{};
 profile=p||{id:user.id,full_name:m.full_name||user.email,role:m.role||'buyer'};
 shop=null;
 if(profile.role==='shop'){
  const {data:ex,error:se}=await db.from('shops').select('*').eq('owner_id',user.id).limit(1);
  if(se)throw se;
  shop=ex?.[0]||null;
  if(!shop){
   const name=(profile.full_name||'Yangi')+' do‘koni';
   const {data:s,error}=await db.from('shops').insert({owner_id:user.id,name,shop_name:name}).select().single();
   if(error)throw error;
   shop=s;
  }
  $('shopName').value=shop.shop_name||shop.name||'';
 }
 $('auth').classList.add('hidden');$('app').classList.remove('hidden');
 setLabel();
 await reloadData();
 const first=shop?'shop':'buyer';
 openPage(first,false);history.replaceState({p:first},'');
}
async function logout(){
 await db.auth.signOut();user=null;shop=null;profile=null;
 data={sales:[],expenses:[],products:[],debts:[],payments:[]};
 document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));
 $('app').classList.add('hidden');$('auth').classList.remove('hidden');
 msg('authMsg','loggedOut');
}
async function reloadData(){
 if(!shop){data={sales:[],expenses:[],products:[],debts:[],payments:[]};renderAll();say('buyerOk');return}
 const q=(tb,o)=>db.from(tb).select('*').eq('shop_id',shop.id).order(o,{ascending:o==='name'});
 const r=await Promise.all([q('sales','created_at'),q('expenses','created_at'),q('products','name'),q('debts','created_at')]);
 for(const x of r)if(x.error)throw x.error;
 const ids=r[3].data.map(d=>d.id);let pays=[];
 if(ids.length){
  const pr=await db.from('payments').select('*').in('debt_id',ids).order('created_at',{ascending:false});
  if(pr.error)throw pr.error;pays=pr.data;
 }
 data.sales=r[0].data.map(x=>({id:x.id,name:x.name,amount:Number(x.amount),type:x.payment_type,date:x.created_at,pid:x.product_id||null,cost:Number(x.cost_total||0)}));
 data.expenses=r[1].data.map(x=>({id:x.id,title:x.name,amount:Number(x.amount),date:x.created_at}));
 data.products=r[2].data.map(x=>({id:x.id,name:x.name,cost:Number(x.cost_price??x.cost??0),price:Number(x.sale_price??x.price??0),quantity:Number(x.quantity||0)}));
 data.debts=r[3].data.map(x=>({id:x.id,buyer:x.buyer_name||x.buyer||t('buyer'),phone:x.buyer_phone||x.phone||'',amount:Number(x.amount),due:x.due_date||'',note:x.note||'',linked:!!x.buyer_id,code:x.claim_code||'',status:x.status||'pending',response:x.buyer_response_note||''}));
 data.payments=pays.map(x=>({id:x.id,debtId:x.debt_id,amount:Number(x.amount),date:x.created_at}));
 renderAll();say('updated');
}

 });

function openPage(id,push=true){
 if(!user)return;
 if(id!=='buyer'&&!shop)id='buyer';
 document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));
 $(id).classList.remove('hidden');
 if(id==='payments')renderPaymentOptions();
 if(id==='reports')renderReports();
 if(id==='buyer')loadBuyerDebts();
 if(push)history.pushState({p:id},'');
 window.scrollTo({top:0});
}
onpopstate=e=>{if(user)openPage(e.state?.p||(shop?'shop':'buyer'),false)};

async function save(table,row,clear){
 const {error}=await db.from(table).insert(row);
 if(error)throw error;
 clear.forEach(i=>$(i).value='');await reloadData();
}
async function makeDebt(buyer,phone,amount,due,note){
 phone=ph(phone);let buyer_id=null;
 if(phone){
  const {data:r,error}=await db.rpc('find_buyer_by_phone',{p_phone:phone});
  if(error)throw error;
  if(r?.length)buyer_id=r[0].buyer_id;
 }
 const {error}=await db.from('debts').insert({shop_id:shop.id,buyer_id,buyer_name:buyer,buyer_phone:phone,amount,due_date:due||null,note:note||null,status:'pending',claim_code:buyer_id?null:(lastCode=genCode())});
 if(error)throw error;
 return buyer_id;
}
const addSale=()=>run(async()=>{
 const name=val('saleName'),amount=num('saleAmount'),type=$('saleType').value,buyer=val('saleBuyer');
 if(!name||!(amount>0))return alert(t('saleNeed'));
 if(type==='qarz'&&!buyer)return alert(t('debtNeed'));
 const pr=data.products.find(p=>p.id===$('saleProduct').value),q=num('saleQty')||1;
 if(pr&&q>pr.quantity)return alert(t('noStock'));
 const row={shop_id:shop.id,name,amount,payment_type:type};
 if(pr){row.product_id=pr.id;row.quantity=q;row.cost_total=pr.cost*q}
 const {error}=await db.from('sales').insert(row);
 if(error)throw error;
 if(pr){const u=await db.from('products').update({quantity:pr.quantity-q}).eq('id',pr.id);if(u.error)throw u.error}
 let linked=true;
 if(type==='qarz')linked=await makeDebt(buyer,val('salePhone'),amount,null,name);
 ['saleName','saleAmount','saleBuyer','salePhone'].forEach(i=>$(i).value='');$('saleProduct').value='';$('saleQty').value=1;
 await reloadData();
 if(!linked)alert(t('unlinked')+'\n'+t('codeLabel')+': '+lastCode);
});
const addExpense=()=>run(async()=>{
 const name=val('expenseName'),amount=num('expenseAmount');
 if(!name||!(amount>0))return alert(t('expNeed'));
 await save('expenses',{shop_id:shop.id,name,amount},['expenseName','expenseAmount']);
});
const addProduct=()=>run(async()=>{
 const name=val('productName'),cost=num('productCost'),price=num('productPrice'),quantity=num('productQty');
 if(!name||!(cost>=0)||!(price>0)||$('productQty').value===''||!(quantity>=0))return alert(t('prodNeed'));
 await save('products',{shop_id:shop.id,name,cost_price:cost,sale_price:price,quantity},['productName','productCost','productPrice','productQty']);
});
const addDebt=()=>run(async()=>{
 const buyer=val('debtBuyer'),amount=num('debtAmount');
 if(!buyer||!(amount>0))return alert(t('debtNeed'));
 const id=await makeDebt(buyer,val('debtPhone'),amount,val('debtDate'),val('debtNote'));
 ['debtBuyer','debtPhone','debtAmount','debtDate','debtNote'].forEach(i=>$(i).value='');
 await reloadData();
 if(!id)alert(t('unlinked')+'\n'+t('codeLabel')+': '+lastCode);
});
const paidFor=id=>data.payments.filter(p=>p.debtId===id).reduce((s,p)=>s+p.amount,0);
const remaining=d=>Math.max(0,d.amount-paidFor(d.id));
const addPayment=()=>run(async()=>{
 const id=$('paymentDebt').value,amount=num('paymentAmount'),d=data.debts.find(x=>x.id===id);
 if(!d)return alert(t('pickDebt'));
 if(!(amount>0)||amount>remaining(d))return alert(t('payBad'));
 await save('payments',{debt_id:id,amount},['paymentAmount']);
});
/* O‘chirish: to‘lovlarni ham o‘chirish mumkin; ruxsat bo‘lmasa xabar chiqadi */
const removeItem=(kind,id)=>{
 if(!confirm(t('delQ')))return;
 run(async()=>{
  if(kind==='debts')await db.from('payments').delete().eq('debt_id',id);
  let q=db.from(kind).delete().eq('id',id);
  if(kind!=='payments')q=q.eq('shop_id',shop.id);
  const {data:r,error}=await q.select();
  if(error)throw error;
  if(!r.length)throw Error(t('noRight'));
  await reloadData();
 });
};
const delBtn=(k,id)=>(k==='payments'?'':`<button class="good" onclick="editItem('${k}','${id}')">${t('edit')}</button> `)+`<button class="danger" onclick="removeItem('${k}','${id}')">${t('del')}</button>`;
const statusText=s=>t(['pending','confirmed','disputed'].includes(s)?s:'unknown');
function list(id,items,html){
 const s=document.querySelector('[data-s="'+id+'"]'),qv=(s?.value||'').toLowerCase();
 if(qv)items=items.filter(x=>[x.name,x.title,x.buyer,x.phone,x.note].join(' ').toLowerCase().includes(qv));
 const n=lim[id]||30;
 $(id).innerHTML=items.length?items.slice(0,n).map(html).join('')+(items.length>n?`<button class="secondary" onclick="lim['${id}']=${n+30};renderAll()">${t('more')}</button>`:''):`<p class="small">${t('noData')}</p>`;
}
function renderPaymentOptions(){
 const s=$('paymentDebt'),old=s.value,a=data.debts.filter(d=>remaining(d)>0);
 s.innerHTML=a.length?a.map(d=>`<option value="${esc(d.id)}">${esc(d.buyer)} — ${money(remaining(d))}</option>`).join(''):`<option value="">${t('noOpen')}</option>`;
 if(a.some(d=>d.id===old))s.value=old;
}
function renderAll(){
 const sum=(a,k)=>a.reduce((s,x)=>s+(Number(x[k])||0),0);
 const today=new Date().toLocaleDateString('sv');
 $('totalSales').textContent=money(sum(data.sales,'amount'));
 $('totalExpenses').textContent=money(sum(data.expenses,'amount'));
 $('totalDebt').textContent=money(data.debts.reduce((s,d)=>s+remaining(d),0));
 $('totalPaid').textContent=money(sum(data.payments,'amount'));
 list('salesList',data.sales,x=>`<div class="item"><b>${esc(x.name)}</b><div>${money(x.amount)} · ${t(x.type==='naqd'?'cash':x.type==='karta'?'card':'credit')}</div><div class="small">${new Date(x.date).toLocaleString(loc())}</div>${delBtn('sales',x.id)}</div>`);
 list('expensesList',data.expenses,x=>`<div class="item"><b>${esc(x.title)}</b><div>${money(x.amount)}</div>${delBtn('expenses',x.id)}</div>`);
 list('productsList',data.products,x=>`<div class="item"><b>${esc(x.name)}</b><div>${t('costL')}: ${money(x.cost)} · ${t('saleL')}: ${money(x.price)}</div><div>${t('qty')}: ${esc(x.quantity)} · ${t('unitProfit')}: ${money(x.price-x.cost)}</div>${delBtn('products',x.id)}</div>`);
 list('debtsList',data.debts,x=>{
  const left=remaining(x),late=x.due&&x.due<today&&left>0;
  return `<div class="item"><b>${esc(x.buyer)}</b><div>${t('tel')}: ${esc(x.phone||t('notSet'))}</div><div>${t('debt')}: ${money(x.amount)} · ${t('paidL')}: ${money(paidFor(x.id))}</div><b>${t('leftL')}: ${money(left)}</b><div><span class="tag">${esc(statusText(x.status))}</span> ${late?`<span class="tag red">${t('overdue')}</span>`:''}</div>${x.response?`<div class="small">${t('buyerNote')}: ${esc(x.response)}</div>`:''}<div class="small">${t('dueL')}: ${esc(x.due||t('unset'))} ${esc(x.note)}</div>${x.linked?'':`<div class="small">${t('codeLabel')}: <b>${esc(x.code)}</b></div>`}${left>0?remind(x.buyer,x.phone,left,x.due,x.linked?'':x.code):''}${delBtn('debts',x.id)}</div>`;
 });
 list('paymentsList',data.payments,p=>{const d=data.debts.find(x=>x.id===p.debtId);return `<div class="item">${esc(d?.buyer||t('buyer'))} — <b>${money(p.amount)}</b><div class="small">${new Date(p.date).toLocaleString(loc())}</div>${delBtn('payments',p.id)}</div>`});
 const g={};
 data.debts.forEach(d=>{const k=ph(d.phone)||d.buyer.toLowerCase();const c=g[k]=g[k]||{name:d.buyer,phone:d.phone,amount:0,paid:0};c.amount+=d.amount;c.paid+=paidFor(d.id)});
 list('customersList',Object.values(g).sort((a,b)=>(b.amount-b.paid)-(a.amount-a.paid)),c=>`<div class="item"><b>${esc(c.name)}</b><div>${t('tel')}: ${esc(c.phone||t('notSet'))}</div><div>${t('debt')}: ${money(c.amount)} · ${t('paidL')}: ${money(c.paid)}</div><b>${t('leftL')}: ${money(c.amount-c.paid)}</b>${c.amount>c.paid?remind(c.name,c.phone,c.amount-c.paid,'',''):''}</div>`);
 const sp=$('saleProduct'),old=sp.value;
 sp.innerHTML=`<option value="">${t('noProduct')}</option>`+data.products.filter(p=>p.quantity>0).map(p=>`<option value="${esc(p.id)}">${esc(p.name)} (${esc(p.quantity)})</option>`).join('');
 if(data.products.some(p=>p.id===old))sp.value=old;
 renderPaymentOptions();renderReports();
}
/* Hisobot: qarzga sotilgan savdo to‘lanmaguncha tushum emas; qarzdan tushgan pul tushumga qo‘shiladi */
function renderReports(){
 const days=Number($('repRange').value),from=days?new Date(new Date().setHours(0,0,0,0)-(days-1)*864e5):null;
 const f=a=>from?a.filter(x=>new Date(x.date)>=from):a,s=a=>a.reduce((n,x)=>n+x.amount,0);
 const S=f(data.sales),sales=s(S),exp=s(f(data.expenses)),paid=s(f(data.payments));
 const debt=data.debts.reduce((n,d)=>n+remaining(d),0),cashIn=s(S.filter(x=>x.type!=='qarz'));
 const real=S.filter(x=>x.pid).reduce((n,x)=>n+x.amount-x.cost,0);
 const stock=data.products.reduce((n,p)=>n+(p.price-p.cost)*p.quantity,0);
 const st=(k,v)=>`<div class="stat"><span>${t(k)}</span><b>${money(v)}</b></div>`;
 $('reportContent').innerHTML=`<div class="stats">${st('totSales',sales)}${st('expenses',exp)}${st('debtLeft',debt)}${st('paidDebt',paid)}${st('netCash',cashIn+paid-exp)}${st('realProfit',real)}${st('stockProfit',stock)}</div><p class="small">${t('repNote')}</p>`;
}
async function loadBuyerDebts(){
 if(!user)return;
 try{
  await db.rpc('claim_my_debts');
  const {data:r,error}=await db.from('debts').select('*').eq('buyer_id',user.id).order('created_at',{ascending:false});
  if(error)throw error;
  const ds=r||[],ids=ds.map(d=>d.id);let ps=[];
  if(ids.length){
   const p=await db.from('payments').select('*').in('debt_id',ids);
   if(p.error)throw p.error;ps=p.data;
  }
  list('buyerDebtsList',ds,d=>{
   const paid=ps.filter(p=>p.debt_id===d.id).reduce((s,p)=>s+Number(p.amount),0);
   const left=Math.max(0,Number(d.amount)-paid),st=d.status||'pending',pend=st==='pending';
   return `<div class="item"><b>${t('debtRec')}</b>
<div>${t('debt')}: ${money(d.amount)}</div><div>${t('paidL')}: ${money(paid)}</div><b>${t('leftL')}: ${money(left)}</b>
<div><span class="tag">${esc(statusText(st))}</span></div>
<div class="small">${t('dueL')}: ${esc(d.due_date||t('unset'))}</div>
${d.buyer_response_note?`<div class="small">${t('objNote')}: ${esc(d.buyer_response_note)}</div>`:''}
${pend?`<label>${t('reason')}</label><textarea id="note-${esc(d.id)}" rows="2" placeholder="${t('whyNot')}"></textarea>
<div class="row"><button class="good" onclick="respondDebt('${esc(d.id)}','confirmed')">${t('bConfirm')}</button><button class="danger" onclick="respondDebt('${esc(d.id)}','disputed')">${t('bDispute')}</button></div>`:''}</div>`;
  });
 }catch(e){say('loadFail',eT(e))}
}
async function respondDebt(id,status){
 try{
  const note=$('note-'+id)?.value.trim()||null;
  if(status==='disputed'&&!note&&!confirm(t('noReasonQ')))return;
  const {error}=await db.rpc('buyer_respond_to_debt',{p_debt_id:id,p_status:status,p_note:note});
  if(error)throw error;
  alert(t(status==='confirmed'?'okConfirm':'okDispute'));
  await loadBuyerDebts();
 }catch(e){alert(t('respFail')+eT(e))}
}
(async()=>{
 tr();
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 try{
  const {data:r,error}=await db.auth.getSession();
  if(error)throw error;
  if(recovering)showReset();else if(r.session){user=r.session.user;await startApp()}
 }catch(e){msg('authMsg','err',eT(e))}
})();
