<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07162e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<title>TengHisob</title>
</head>
<body>
<header>
<div class="langbox"><label for="languageSelect">Til / Язык</label>
<select id="languageSelect" onchange="changeLanguage(this.value)"><option value="uz">O‘zbekcha</option><option value="ru">Русский</option></select></div>
<h1>TengHisob</h1>
<p data-i="sub"></p>
</header>
<main>
<section id="auth" class="card">
<h2 id="authTitle" data-i="login"></h2>
<div id="signupBox" class="hidden">
<label data-i="fullName"></label><input id="fullName" data-p="namePh" autocomplete="name">
<label data-i="phone"></label><input id="phone" type="tel" placeholder="+998...">
<label data-i="role"></label>
<select id="role"><option value="shop" data-i="shopOwner"></option><option value="buyer" data-i="buyer"></option></select>
</div>
<label data-i="email"></label><input id="email" type="email" autocomplete="email">
<label data-i="pass"></label><input id="password" type="password" autocomplete="current-password">
<button class="primary" id="authBtn" onclick="authenticate()" data-i="signin"></button>
<button class="secondary" id="switchBtn" onclick="toggleAuth()" data-i="signup"></button>
<button class="secondary" onclick="forgot()" data-i="forgot"></button>
<p id="authMsg" class="small"></p>
</section>

<section id="reset" class="card hidden">
<h2 data-i="newPass"></h2>
<label data-i="pass"></label>
<input id="newPassword" type="password" minlength="8" autocomplete="new-password">
<button class="primary" onclick="savePass()" data-i="savePass"></button>
<p id="resetMsg" class="small"></p>
</section>

<section id="app" class="hidden">
<div class="card topline">
<div><div class="small" data-i="account"></div><b id="userLabel"></b></div>
<button class="danger" onclick="logout()" data-i="logout"></button>
</div>

<section class="card" id="notificationPanel">
<div class="row">
<h3 data-i="notifications"></h3>
<button class="secondary" onclick="loadNotifications()" data-i="refresh"></button>
</div>
<div id="notificationsList"></div>
</section>

<section id="shop" class="card page hidden">
<h2 data-i="shopOwner"></h2>
<label data-i="shopName"></label><input id="shopName">
<button class="secondary" onclick="saveShopName()" data-i="saveShop"></button>
<label data-i="shopAddress"></label><input id="shopAddress" autocomplete="street-address">
<label data-i="shopPhone"></label><input id="shopPhone" type="tel" placeholder="+998...">
<label data-i="shopDescription"></label><textarea id="shopDescription" rows="2"></textarea>
<button class="secondary" onclick="saveShopProfile()" data-i="saveShopProfile"></button>
<button class="secondary" id="listShopBtn" onclick="toggleShopListing()" data-i="listingEnable"></button>
<p class="small" data-i="listingInfo"></p>
<div class="stats">
<div class="stat"><span data-i="totSales"></span><b id="totalSales"></b></div>
<div class="stat"><span data-i="expenses"></span><b id="totalExpenses"></b></div>
<div class="stat"><span data-i="debtLeft"></span><b id="totalDebt"></b></div>
<div class="stat"><span data-i="paidDebt"></span><b id="totalPaid"></b></div>
</div>
<div class="nav">
<button onclick="openPage('sales')" data-i="sales"></button>
<button onclick="openPage('expenses')" data-i="expenses"></button>
<button onclick="openPage('products')" data-i="products"></button>
<button onclick="openPage('debts')" data-i="debts"></button>
<button onclick="openPage('payments')" data-i="payments"></button>
<button onclick="openPage('reports')" data-i="reports"></button>
<button onclick="openPage('customers')" data-i="customers"></button>
<button onclick="openPage('shopAppeals')" data-i="appealsTitle"></button>
</div>
</section>

<section id="sales" class="card page hidden">
<h2 data-i="addSale"></h2>
<label data-i="product"></label><select id="saleProduct" onchange="pickProduct()"></select>
<label data-i="qty"></label><input id="saleQty" type="number" min="0.01" step="any" value="1" inputmode="decimal" oninput="pickProduct()">
<label data-i="saleName"></label><input id="saleName" data-p="eg">
<label data-i="amount"></label><input id="saleAmount" type="number" min="1" step="1" inputmode="numeric">
<label data-i="payType"></label>
<select id="saleType" onchange="$('saleDebt').classList.toggle('hidden',this.value!=='qarz')">
<option value="naqd" data-i="cash"></option>
<option value="karta" data-i="card"></option>
<option value="qarz" data-i="credit"></option>
</select>
<div id="saleDebt" class="hidden">
<label data-i="buyerName"></label><input id="saleBuyer">
<label data-i="phone"></label><input id="salePhone" type="tel" placeholder="+998...">
<label data-i="due"></label><input id="saleDueDate" type="date">
</div>
<button class="primary" onclick="addSale()" data-i="saveSale"></button>
<input data-s="salesList" data-p="search" oninput="renderAll()" style="margin-top:14px">
<div id="salesList"></div>
<button class="secondary" onclick="openPage('shop')" data-i="back"></button>
</section>

<section id="expenses" class="card page hidden">
<h2 data-i="expense"></h2>
<label data-i="expName"></label><input id="expenseName">
<label data-i="amount"></label><input id="expenseAmount" type="number" min="1" step="1" inputmode="numeric">
<button class="primary" onclick="addExpense()" data-i="saveExp"></button>
<div id="expensesList"></div>
<button class="secondary" onclick="openPage('shop')" data-i="back"></button>
</section>

<section id="products" class="card page hidden">
<h2 data-i="products"></h2>
<label data-i="prodName"></label><input id="productName">
<div class="row">
<div><label data-i="cost"></label><input id="productCost" type="number" min="0" step="1" inputmode="numeric"></div>
<div><label data-i="price"></label><input id="productPrice" type="number" min="1" step="1" inputmode="numeric"></div>
</div>
<label data-i="qty"></label><input id="productQty" type="number" min="0" step="any" inputmode="decimal">
<button class="primary" onclick="addProduct()" data-i="saveProd"></button>
<input data-s="productsList" data-p="search" oninput="renderAll()" style="margin-top:14px">
<div id="productsList"></div>
<button class="secondary" onclick="openPage('shop')" data-i="back"></button>
</section>

<section id="debts" class="card page hidden">
<h2 data-i="debtTitle"></h2>
<label data-i="buyerName"></label><input id="debtBuyer">
<label data-i="phone"></label><input id="debtPhone" type="tel" placeholder="+998...">
<label data-i="debtAmt"></label><input id="debtAmount" type="number" min="1" step="1" inputmode="numeric">
<label data-i="due"></label><input id="debtDate" type="date">
<label data-i="note"></label><input id="debtNote">
<button class="primary" onclick="addDebt()" data-i="saveDebt"></button>
<input data-s="debtsList" data-p="search" oninput="renderAll()" style="margin-top:14px">
<div id="debtsList"></div>
<button class="secondary" onclick="openPage('shop')" data-i="back"></button>
</section>

<section id="payments" class="card page hidden">
<h2 data-i="payTitle"></h2>
<label data-i="debt"></label><select id="paymentDebt"></select>
<label data-i="paidAmt"></label><input id="paymentAmount" type="number" min="1" step="1" inputmode="numeric">
<button class="primary" onclick="addPayment()" data-i="savePay"></button>
<div id="paymentsList"></div>
<button class="secondary" onclick="openPage('shop')" data-i="back"></button>
</section>

<section id="reports" class="card page hidden">
<h2 data-i="reports"></h2>
<select id="repRange" onchange="renderReports()">
<option value="1" data-i="rToday"></option>
<option value="7" data-i="r7"></option>
<option value="30" data-i="r30"></option>
<option value="0" data-i="rAll" selected></option>
</select>
<div id="reportContent"></div>
<button class="primary" onclick="exportCSV()" data-i="exportCsv"></button>
<button class="secondary" onclick="openPage('shop')" data-i="back"></button>
</section>

<section id="customers" class="card page hidden">
<h2 data-i="customers"></h2>
<div id="customersList"></div>
<button class="secondary" onclick="openPage('shop')" data-i="back"></button>
</section>

<section id="shopAppeals" class="card page hidden">
<h2 data-i="appealsTitle"></h2>
<div id="shopAppealsList"></div>
<button class="secondary" onclick="openPage('shop')" data-i="back"></button>
</section>

<section id="catalog" class="card page hidden">
<h2 data-i="catalogTitle"></h2>
<div id="shopCatalogList"></div>
<button class="secondary" onclick="openPage('buyer')" data-i="back"></button>
</section>

<section id="buyer" class="card page hidden">
<h2 data-i="buyer"></h2>
<p class="small" data-i="buyerInfo"></p>
<div class="card">
<div class="topline"><b data-i="ratingTitle"></b><b id="buyerRatingScore">100/100</b></div>
<div id="buyerRatingEvents"></div>
</div>
<button class="secondary" onclick="openPage('catalog')" data-i="catalogTitle"></button>
<button class="primary" onclick="loadBuyerDebts()" data-i="refresh"></button>
<label data-i="codeIn"></label>
<div class="row">
<input id="claimCode" autocapitalize="characters">
<button class="good" onclick="claimCode()" data-i="addByCode"></button>
</div>
<div id="buyerDebtsList"></div>
</section>

<div id="status" class="notice" data-i="loading"></div>
</section>
</main>

const t=k=>(L[k]||[k,k])[lang==='ru'?1:0];
const loc=()=>lang==='ru'?'ru-RU':'uz-UZ';
const money=n=>(Number(n)||0).toLocaleString(loc(),{maximumFractionDigits:2})+(lang==='ru'?' сум':' so‘m');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ph=p=>{
 let d=(p||'').replace(/\D/g,'');
 if(d.length===9)d='998'+d;
 if(d.length===11&&d[0]==='8')d='7'+d.slice(1);
 return d?'+'+d:'';
};
const eT=e=>{
 const m=e.message||String(e);
 return /invalid login/i.test(m)?t('badLogin'):/already registered/i.test(m)?t('exists'):/rate limit|too many/i.test(m)?t('rate'):m;
};

function toggleAuth(){
 mode=!mode;
 $('signupBox').classList.toggle('hidden',!mode);
 $('authTitle').dataset.i=mode?'signup':'login';
 $('authBtn').dataset.i=mode?'register':'signin';
 $('switchBtn').dataset.i=mode?'haveAcc':'signup';

 msg('authMsg','');
}

async function authenticate(){
 const email=val('email'),password=$('password').value;
 if(!email||password.length<6)return msg('authMsg','needEmail');
 if(mode&&password.length<8)return msg('authMsg','passNeed8');
 if(mode&&!val('fullName'))return msg('authMsg','needName');
 $('authBtn').disabled=true;
 msg('authMsg','checking');
 try{
  let res;
  if(mode){
   res=await db.auth.signUp({
    email,password,
    options:{data:{
     full_name:val('fullName'),
     phone:ph(val('phone')),
     role:$('role').value
    }}
   });
  }else{
   res=await db.auth.signInWithPassword({email,password});
  }
  if(res.error)throw res.error;
  if(!res.data.session)return msg('authMsg','noSession');
  user=res.data.user;
  msg('authMsg','');
  await startApp();
 }catch(e){
  msg('authMsg','err',eT(e));
 }finally{
  $('authBtn').disabled=false;
 }
}

const editItem=(kind,id)=>run(async()=>{
 const x=data[kind].find(i=>i.id===id);
 const isP=kind==='products',isD=kind==='debts';
 const nm=prompt(t(isD?'note':'editName'),isD?x.note:(x.name||x.title));
 if(nm===null)return;
 const v=Number(prompt(t('editVal'),isP?x.price:x.amount));
 if(!(v>0)||(!isD&&!nm.trim()))return alert(t('saleNeed'));
 let e;
 if(isD){
  const due=prompt(t('editDue'),x.due||'');
  if(due===null)return;
  const date=due.trim();
  if(date&&!/^\d{4}-\d{2}-\d{2}$/.test(date))return alert(t('editDue'));
  e=(await db.rpc('edit_debt_details',{
   p_id:id,p_amount:v,p_note:nm.trim(),p_due_date:date||null
  })).error;
 }else if(isP){
  e=(await db.from('products').update({
   name:nm.trim(),selling_price:v,sale_price:v
  }).eq('id',id).eq('shop_id',shop.id)).error;
 }else if(kind==='expenses'){
  e=(await db.from('expenses').update({
   name:nm.trim(),title:nm.trim(),amount:v
  }).eq('id',id).eq('shop_id',shop.id)).error;
 }else{
  e=(await db.from(kind).update({
   name:nm.trim(),amount:v
  }).eq('id',id).eq('shop_id',shop.id)).error;
 }
 if(e)throw e;
 await reloadData();
});

function exportCSV(){
 const q=v=>{
  let s=String(v??'');
  if(/^[=+\-@]/.test(s))s="'"+s;
  return '"'+s.replace(/"/g,'""')+'"';
 };
 const R=[['turi','nomi','summa','izoh','sana']];
 data.sales.forEach(x=>R.push(['savdo',x.name,x.amount,x.type,x.date]));
 data.expenses.forEach(x=>R.push(['xarajat',x.title,x.amount,'',x.date]));
 data.debts.forEach(x=>R.push(['qarz',x.buyer,x.amount,'tolangan '+paidFor(x.id)+'; muddat '+x.due,'']));
 data.payments.forEach(x=>R.push(['tolov',(data.debts.find(d=>d.id===x.debtId)||{}).buyer||'',x.amount,'',x.date]));
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob(['\ufeff'+R.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));
 a.download='tenghisob.csv';
 a.click();
 URL.revokeObjectURL(a.href);
}

async function startApp(){
 const {data:p,error:pe}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();
 if(pe)throw pe;
 const m=user.user_metadata||{};
 profile=p||{id:user.id,full_name:m.full_name||user.email,role:m.role||'buyer'};
 shop=null;

 if(profile.role==='shop'){
  const {data:ex,error:se}=await db.from('shops').select('*').eq('owner_id',user.id).limit(1);
  if(se)throw se;
  shop=ex?.[0]||null;

  if(!shop){
   const name=(profile.full_name||'Yangi')+' do‘koni';
   const {data:s,error}=await db.from('shops').insert({
    owner_id:user.id,name,shop_name:name
   }).select().single();
   if(error)throw error;
   shop=s;
  }
  $('shopName').value=shop.shop_name||shop.name||'';
  $('shopAddress').value=shop.address||'';
  $('shopPhone').value=shop.contact_phone||'';
  $('shopDescription').value=shop.description||'';
  $('listShopBtn').dataset.i=shop.is_listed?'listingDisable':'listingEnable';
  tr();
 }

 $('auth').classList.add('hidden');
 $('app').classList.remove('hidden');
 setLabel();
 await reloadData();
 await loadNotifications();
 subscribeRealtime();
 const first=shop?'shop':'buyer';
 openPage(first,false);
 history.replaceState({p:first},'');
}

async function reloadData(){
 if(!shop){
  data={sales:[],expenses:[],products:[],debts:[],payments:[],ratings:{},debtHistory:[]};
  renderAll();
  say('buyerOk');
  return;
 }

 const q=(tb,o)=>db.from(tb).select('*').eq('shop_id',shop.id).order(o,{ascending:o==='name'});
 const r=await Promise.all([
  q('sales','created_at'),
  q('expenses','created_at'),
  q('products','name'),
  q('debts','created_at')
 ]);
 for(const x of r)if(x.error)throw x.error;

 const ids=r[3].data.map(d=>d.id);
 let pays=[],debtHistory=[];
 if(ids.length){
  const [pr,hr]=await Promise.all([
   db.from('payments').select('*').in('debt_id',ids).order('created_at',{ascending:false}),
   db.from('debt_history').select('debt_id,action,old_data,new_data,created_at').in('debt_id',ids).order('created_at',{ascending:false})
  ]);
  if(pr.error)throw pr.error;
  if(hr.error)throw hr.error;
  pays=pr.data;debtHistory=hr.data||[];
 }

 data.sales=r[0].data.map(x=>({
  id:x.id,name:x.name,amount:Number(x.amount),debtId:x.debt_id||null,
  type:x.payment_type,date:x.created_at,
  pid:x.product_id||null,cost:Number(x.cost_total||0)
 }));
 data.expenses=r[1].data.map(x=>({
  id:x.id,title:x.title||x.name,
  amount:Number(x.amount),date:x.spent_at||x.created_at
 }));
 data.products=r[2].data.map(x=>({
  id:x.id,name:x.name,
  cost:Number(x.cost_price??x.cost??0),
  price:Number(x.selling_price??x.sale_price??x.price??0),
  quantity:Number(x.quantity||0)
 }));
 data.debts=r[3].data.map(x=>({
  id:x.id,buyerId:x.buyer_id||null,buyer:x.buyer_name||x.buyer||t('buyer'),
  phone:x.buyer_phone||x.phone||'',
  amount:Number(x.amount),due:x.due_date||'',
  note:x.note||'',linked:!!x.buyer_id,
  code:x.claim_code||'',status:x.status||'pending',
  response:x.buyer_response_note||''
 }));
 const buyerIds=[...new Set(data.debts.map(d=>d.buyerId).filter(Boolean))];
 data.ratings={};
 if(buyerIds.length){
  const rr=await db.from('buyer_rating_summary').select('buyer_id,score').in('buyer_id',buyerIds);
  if(rr.error)throw rr.error;
  (rr.data||[]).forEach(x=>data.ratings[x.buyer_id]=x.score);
 }
 data.payments=pays.map(x=>({
  id:x.id,debtId:x.debt_id,
  amount:Number(x.amount),date:x.paid_at||x.created_at
 }));
 data.debtHistory=debtHistory;

 renderAll();
 say('updated');
}

async function loadNotifications(){
 if(!user)return;
 try{
  const {data:r,error}=await db.from('notifications')
   .select('*').eq('user_id',user.id)
   .order('created_at',{ascending:false}).limit(30);
  if(error)throw error;
  notifications=r||[];
  renderNotifications();
 }catch(e){
  $('notificationsList').innerHTML=`<p class="small">${esc(eT(e))}</p>`;
 }
}

function subscribeRealtime(){
 if(!user)return;
 if(realtimeChannel)db.removeChannel(realtimeChannel);
 realtimeChannel=db.channel('tenghisob-'+user.id)
  .on('postgres_changes',{event:'*',schema:'public',table:'notifications',filter:'user_id=eq.'+user.id},()=>{
   loadNotifications();
  })
  .on('postgres_changes',{event:'*',schema:'public',table:'debts'},()=>{
   if(shop)reloadData();
   else if(!$('buyer').classList.contains('hidden'))loadBuyerDebts();
  })
  .on('postgres_changes',{event:'*',schema:'public',table:'payments'},()=>{
   if(shop)reloadData();
   else if(!$('buyer').classList.contains('hidden'))loadBuyerDebts();
  })
  .on('postgres_changes',{event:'*',schema:'public',table:'buyer_rating_events'},()=>{
   if(shop)reloadData();
   else loadBuyerRating();
  })
  .on('postgres_changes',{event:'*',schema:'public',table:'buyer_rating_appeals'},()=>{
   if(shop&&$('shopAppeals')&&!$('shopAppeals').classList.contains('hidden'))loadShopAppeals();
   if(!shop)loadBuyerRating();
  })
  .subscribe();
}

function renderNotifications(){

 }
 el.innerHTML=notifications.map(n=>`
  <div class="item">
   <b>${esc(n.title)}</b>

 `).join('');
}

async function loadBuyerRating(){
 if(!user||profile.role!=='buyer')return;
 try{
  const {data:r,error}=await db.from('buyer_rating_summary')
   .select('score,updated_at').eq('buyer_id',user.id).maybeSingle();
  if(error)throw error;
  $('buyerRatingScore').textContent=(r?.score??100)+'/100';
  const {data:events,error:ee}=await db.from('buyer_rating_events')
   .select('id,event_type,points,status,reason,created_at')
   .eq('buyer_id',user.id).order('created_at',{ascending:false}).limit(30);
  if(ee)throw ee;
  const ids=(events||[]).map(x=>x.id);
  let appeals=[];
  if(ids.length){
   const a=await db.from('buyer_rating_appeals')
    .select('event_id,status,reason,review_note')
    .in('event_id',ids);
   if(a.error)throw a.error;
   appeals=a.data||[];
  }
  $('buyerRatingEvents').innerHTML=events?.length?events.map(e=>{
   const appeal=appeals.find(a=>a.event_id===e.id);
   return `<div class="item">
    <b>${esc(e.reason||e.event_type)}</b>
    <div>${Number(e.points)>0?'+':''}${Number(e.points)} · ${esc(e.status)}</div>
    <div class="small">${new Date(e.created_at).toLocaleString(loc())}</div>
    ${appeal?`<div class="small">${t(appeal.status==='pending'?'appealPending':appeal.status==='accepted'?'appealAccepted':'appealRejected')}</div>${appeal.review_note?`<div class="small">${esc(appeal.review_note)}</div>`:''}`:
     e.status==='applied'&&Number(e.points)<0?`<textarea id="ratingReason-${esc(e.id)}" maxlength="1000" placeholder="${t('appealReason')}"></textarea><button class="secondary" onclick="submitRatingAppeal('${esc(e.id)}')">${t('appealSend')}</button>`:''}
   </div>`;
  }).join(''):'<p class="small">'+t('ratingNoEvents')+'</p>';
 }catch(e){$('buyerRatingEvents').innerHTML='<p class="small">'+esc(eT(e))+'</p>';}
}

async function submitRatingAppeal(id){
 const reason=$('ratingReason-'+id)?.value.trim()||'';
 if(reason.length<5||reason.length>1000)return alert(t('appealReason'));
 try{
  const {error}=await db.rpc('submit_buyer_rating_appeal',{p_event_id:id,p_reason:reason});
  if(error)throw error;
  await loadBuyerRating();
 }catch(e){alert(t('err')+eT(e));}
}

async function loadShopAppeals(){
 const el=$('shopAppealsList');
 try{
  el.innerHTML='<p class="small">'+t('loading')+'</p>';
  const {data:a,error}=await db.from('buyer_rating_appeals')
   .select('id,event_id,buyer_id,reason,created_at,status')
   .eq('status','pending').order('created_at',{ascending:true});
  if(error)throw error;
  if(!a?.length){el.innerHTML='<p class="small">'+t('noAppeals')+'</p>';return;}
  const ids=a.map(x=>x.event_id);
  const {data:events,error:ee}=await db.from('buyer_rating_events')
   .select('id,event_type,points,reason,shop_id,debt_id').in('id',ids);
  if(ee)throw ee;
  const debtIds=[...new Set((events||[]).map(x=>x.debt_id).filter(Boolean))];
  let debtById={};
  if(debtIds.length){
   const dr=await db.from('debts').select('id,buyer_name,amount,due_date,status').in('id',debtIds);
   if(dr.error)throw dr.error;
   debtById=Object.fromEntries((dr.data||[]).map(x=>[x.id,x]));
  }
  const byId=Object.fromEntries((events||[]).map(x=>[x.id,x]));
  el.innerHTML=a.filter(x=>byId[x.event_id]?.shop_id===shop.id).map(x=>{
   const ev=byId[x.event_id];
   return `<div class="item">
    <b>${esc(ev?.reason||ev?.event_type||'')}</b>
    <div>${t('ratingTitle')}: ${Number(ev?.points||0)}</div>
    ${debtById[ev?.debt_id]?`<div>${esc(debtById[ev.debt_id].buyer_name||'')} · ${money(debtById[ev.debt_id].amount)} · ${esc(debtById[ev.debt_id].due_date||'')}</div>`:''}
    <div>${esc(x.reason)}</div>
    <div class="small">${new Date(x.created_at).toLocaleString(loc())}</div>
    <button class="good" onclick="reviewRatingAppeal('${esc(x.id)}','accepted')">${t('appealAccept')}</button>
    <button class="danger" onclick="reviewRatingAppeal('${esc(x.id)}','rejected')">${t('appealReject')}</button>
   </div>`;
  }).join('')||'<p class="small">'+t('noAppeals')+'</p>';
 }catch(e){el.innerHTML='<p class="small">'+esc(eT(e))+'</p>';}
}

function openPage(id,push=true){
 if(!user)return;
 if(!shop&&!['buyer','catalog'].includes(id))id='buyer';
 if(shop&&id==='catalog')id='shop';
 document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));
 $(id).classList.remove('hidden');
 if(id==='payments')renderPaymentOptions();
 if(id==='reports')renderReports();
 if(id==='buyer'){loadBuyerDebts();loadBuyerRating();}
 if(id==='catalog')loadShopCatalog();
 if(id==='shopAppeals')loadShopAppeals();

onpopstate=e=>{

async function save(table,row,clear){
 const {error}=await db.from(table).insert(row);
 if(error)throw error;
 clear.forEach(i=>$(i).value='');
 await reloadData();
 await loadNotifications();
}

async function makeDebt(buyer,phone,amount,due,note){
 phone=ph(phone);
 let buyer_id=null;
 if(phone){
  const {data:r,error}=await db.rpc('find_buyer_by_phone',{p_phone:phone});
  if(error)throw error;
  if(r?.length)buyer_id=r[0].buyer_id;
 }
 const code=buyer_id?null:genCode();
 const {error}=await db.from('debts').insert({
  shop_id:shop.id,buyer_id,
  buyer_name:buyer,buyer_phone:phone,
  amount,due_date:due||null,
  note:note||null,status:'pending',
  claim_code:code
 });
 if(error)throw error;
 lastCode=code||'';
 return buyer_id;
}

const addSale=()=>run(async()=>{
 const name=val('saleName');
 const amount=num('saleAmount');
 const type=$('saleType').value;
 const buyer=val('saleBuyer');
 const phone=ph(val('salePhone'));

 if(!name||!(amount>0)||!Number.isFinite(amount))return alert(t('saleNeed'));
 if(type==='qarz'&&!buyer)return alert(t('debtNeed'));

 const pr=data.products.find(p=>p.id===$('saleProduct').value);
 const q=num('saleQty');

 if(pr&&(!(q>0)||!Number.isFinite(q)))return alert(t('prodNeed'));
 if(pr&&q>pr.quantity)return alert(t('noStock'));

 const params={
  p_shop_id:shop.id,
  p_name:name,
  p_amount:amount,
  p_payment_type:type,
  p_product_id:pr?pr.id:null,
  p_quantity:pr?q:null,
  p_cost_total:pr?pr.cost*q:0,
  p_buyer_name:type==='qarz'?buyer:null,
  p_buyer_phone:type==='qarz'?phone:null,
  p_due_date:val('saleDueDate')||null,
  p_note:type==='qarz'?name:null,
  p_claim_code:null
 };

 const {data:result,error}=await db.rpc('record_sale_atomic',params);
 if(error)throw error;

 lastCode=result?.claim_code||'';

 ['saleName','saleAmount','saleBuyer','salePhone','saleDueDate'].forEach(i=>$(i).value='');
 $('saleProduct').value='';
 $('saleQty').value=1;
 $('saleType').value='naqd';
 $('saleDebt').classList.add('hidden');

 await reloadData();
 await loadNotifications();

 if(type==='qarz'&&lastCode){
  alert(t('unlinked')+'\n'+t('codeLabel')+': '+lastCode);
 }
});

const addExpense=()=>run(async()=>{

 const amount=num('expenseAmount');
 if(!name||!(amount>0)||!Number.isFinite(amount))return alert(t('expNeed'));
 await save('expenses',{

const addProduct=()=>run(async()=>{

 if(!name||!(cost>=0)||!Number.isFinite(cost)||!(price>0)||!Number.isFinite(price)||$('productQty').value===''||!(quantity>=0)||!Number.isFinite(quantity))return alert(t('prodNeed'));

const addDebt=()=>run(async()=>{
 const buyer=val('debtBuyer');
 const amount=num('debtAmount');
 if(!buyer||!(amount>0)||!Number.isFinite(amount))return alert(t('debtNeed'));
 const id=await makeDebt(
  buyer,val('debtPhone'),amount,
  val('debtDate'),val('debtNote')
 );
 ['debtBuyer','debtPhone','debtAmount','debtDate','debtNote'].forEach(i=>$(i).value='');

 if(!id)alert(t('unlinked')+'\n'+t('codeLabel')+': '+lastCode);
});

const paidFor=id=>data.payments
 .filter(p=>p.debtId===id)
 .reduce((s,p)=>s+p.amount,0);

const remaining=d=>Math.max(0,d.amount-paidFor(d.id));

const addPayment=()=>run(async()=>{
 const id=$('paymentDebt').value;
 const amount=num('paymentAmount');
 const d=data.debts.find(x=>x.id===id);

 if(!d)return alert(t('pickDebt'));
 if(d.status!=='confirmed')return alert(t('pending'));
 if(!(amount>0)||!Number.isFinite(amount)||amount>remaining(d))return alert(t('payBad'));

 await save('payments',{debt_id:id,amount},['paymentAmount']);
});

const removeItem=(kind,id)=>{
 if(!confirm(t('delQ')))return;
 run(async()=>{
  if(kind==='debts'){
   const {error}=await db.from('debts')
    .delete().eq('id',id).eq('shop_id',shop.id);
   if(error)throw error;
  }else{
   let q=db.from(kind).delete().eq('id',id);
   if(kind!=='payments')q=q.eq('shop_id',shop.id);
   const {data:r,error}=await q.select();
   if(error)throw error;
   if(!r.length)throw Error(t('noRight'));
  }
  await reloadData();
  await loadNotifications();
 });
};

const delBtn=(k,id)=>k==='payments'?'':
 `<button class="good" onclick="editItem('${k}','${id}')">${t('edit')}</button> `+
 `<button class="danger" onclick="removeItem('${k}','${id}')">${t('del')}</button>`;

const statusText=s=>t(
 ['pending','confirmed','disputed','paid'].includes(s)?s:'unknown'
);
const debtHistoryText=h=>{
 const old=h.old_data||{},next=h.new_data||{};
 if(h.action==='create')return t('historyCreate');
 if(h.action==='delete')return t('historyDelete');
 const changes=[];
 if(old.amount!==next.amount)changes.push(t('debt')+': '+money(old.amount)+' → '+money(next.amount));
 if(old.due_date!==next.due_date)changes.push(t('due')+': '+(old.due_date||t('unset'))+' → '+(next.due_date||t('unset')));
 if(old.note!==next.note)changes.push(t('note')+' o‘zgardi');
 return t('historyUpdate')+(changes.length?': '+changes.join(' · '):'');
};

function list(id,items,html){
 const s=document.querySelector('[data-s="'+id+'"]');
 const qv=(s?.value||'').toLowerCase();
 if(qv){
  items=items.filter(x=>
   [x.name,x.title,x.buyer,x.phone,x.note].join(' ').toLowerCase().includes(qv)
  );
 }
 const n=lim[id]||30;
 $(id).innerHTML=items.length
  ?items.slice(0,n).map(html).join('')+
   (items.length>n?`<button class="secondary" onclick="lim['${id}']=${n+30};renderAll()">${t('more')}</button>`:'')
  :`<p class="small">${t('noData')}</p>`;
}

function renderPaymentOptions(){
 const s=$('paymentDebt');
 const old=s.value;
 const a=data.debts.filter(d=>d.status==='confirmed'&&remaining(d)>0);
 s.innerHTML=a.length
  ?a.map(d=>`<option value="${esc(d.id)}">${esc(d.buyer)} — ${money(remaining(d))}</option>`).join('')
  :`<option value="">${t('noOpen')}</option>`;
 if(a.some(d=>d.id===old))s.value=old;
}

function renderAll(){
 const sum=(a,k)=>a.reduce((s,x)=>s+(Number(x[k])||0),0);
 const today=new Date().toLocaleDateString('sv');

 const confirmedDebts=data.debts.filter(d=>d.status==='confirmed'||d.status==='paid');
 const confirmedIds=new Set(confirmedDebts.map(d=>d.id));
 const confirmedPayments=data.payments.filter(p=>confirmedIds.has(p.debtId));

 $('totalSales').textContent=money(sum(data.sales,'amount'));
 $('totalExpenses').textContent=money(sum(data.expenses,'amount'));
 $('totalDebt').textContent=money(confirmedDebts.reduce((s,d)=>s+remaining(d),0));
 $('totalPaid').textContent=money(sum(confirmedPayments,'amount'));

 list('salesList',data.sales,x=>`
  <div class="item">
   <b>${esc(x.name)}</b>
   <div>${money(x.amount)} · ${t(x.type==='naqd'?'cash':x.type==='karta'?'card':'credit')}</div>
   <div class="small">${new Date(x.date).toLocaleString(loc())}</div>
   ${x.type==='qarz'?'':delBtn('sales',x.id)}
  </div>
 `);

 list('expensesList',data.expenses,x=>`
  <div class="item">
   <b>${esc(x.title)}</b>
   <div>${money(x.amount)}</div>
   <div class="small">${x.date?new Date(x.date).toLocaleString(loc()):''}</div>
   ${delBtn('expenses',x.id)}
  </div>
 `);

 list('productsList',data.products,x=>`
  <div class="item">
   <b>${esc(x.name)}</b>
   <div>${t('costL')}: ${money(x.cost)} · ${t('saleL')}: ${money(x.price)}</div>
   <div>${t('qty')}: ${esc(x.quantity)} · ${t('unitProfit')}: ${money(x.price-x.cost)}</div>
   ${delBtn('products',x.id)}
  </div>
 `);

 list('debtsList',data.debts,x=>{
  const left=remaining(x);
  const late=x.due&&x.due<today&&left>0;
  return `
   <div class="item">
    <b>${esc(x.buyer)}</b>
    <div>${t('tel')}: ${esc(x.phone||t('notSet'))}</div>
    <div>${t('debt')}: ${money(x.amount)} · ${t('paidL')}: ${money(paidFor(x.id))}</div>
    ${x.buyerId&&data.ratings[x.buyerId]!==undefined?`<div><span class="tag">${t('ratingLabel')}: ${data.ratings[x.buyerId]}/100</span></div>`:''}
    <b>${t('leftL')}: ${money(left)}</b>
    <div><span class="tag">${esc(statusText(x.status))}</span> ${late?`<span class="tag red">${t('overdue')}</span>`:''}</div>
    ${x.response?`<div class="small">${t('buyerNote')}: ${esc(x.response)}</div>`:''}
    <div class="small">${t('dueL')}: ${esc(x.due||t('unset'))} ${esc(x.note)}</div>
    ${data.debtHistory.filter(h=>h.debt_id===x.id).length?`<div class="small"><b>${t('historyTitle')}:</b> ${data.debtHistory.filter(h=>h.debt_id===x.id).map(h=>esc(debtHistoryText(h))+' · '+new Date(h.created_at).toLocaleDateString(loc())).join(' | ')}</div>`:''}
    ${x.linked?'':`<div class="small">${t('codeLabel')}: <b>${esc(x.code)}</b></div>`}
    ${left>0&&x.status==='confirmed'?remind(x.buyer,x.phone,left,x.due,x.linked?'':x.code):''}
    ${x.status==='pending'&&!data.sales.some(s=>s.debtId===x.id)?delBtn('debts',x.id):''}
   </div>
  `;
 });

 list('paymentsList',data.payments,p=>{
  const d=data.debts.find(x=>x.id===p.debtId);
  return `
   <div class="item">
    ${esc(d?.buyer||t('buyer'))} — <b>${money(p.amount)}</b>
    <div class="small">${p.date?new Date(p.date).toLocaleString(loc()):''}</div>
    ${delBtn('payments',p.id)}
   </div>
  `;
 });

 const g={};
 confirmedDebts.forEach(d=>{
  const k=ph(d.phone)||d.buyer.toLowerCase();
  const c=g[k]=g[k]||{name:d.buyer,phone:d.phone,buyerId:d.buyerId,amount:0,paid:0};
  c.amount+=d.amount;
  c.paid+=paidFor(d.id);
 });

 list('customersList',Object.values(g).sort((a,b)=>(b.amount-b.paid)-(a.amount-a.paid)),c=>`
  <div class="item">
   <b>${esc(c.name)}</b>
   <div>${t('tel')}: ${esc(c.phone||t('notSet'))}</div>
   <div>${t('debt')}: ${money(c.amount)} · ${t('paidL')}: ${money(c.paid)}</div>
   <b>${t('leftL')}: ${money(c.amount-c.paid)}</b>
   ${c.buyerId&&data.ratings[c.buyerId]!==undefined?`<div><span class="tag">${t('ratingLabel')}: ${data.ratings[c.buyerId]}/100</span></div>`:''}
   ${c.amount>c.paid?remind(c.name,c.phone,c.amount-c.paid,'',''):''}
  </div>
 `);

 const sp=$('saleProduct'),old=sp.value;
 sp.innerHTML=`<option value="">${t('noProduct')}</option>`+
  data.products.filter(p=>p.quantity>0).map(p=>
   `<option value="${esc(p.id)}">${esc(p.name)} (${esc(p.quantity)})</option>`
  ).join('');
 if(data.products.some(p=>p.id===old))sp.value=old;

 renderPaymentOptions();
 renderReports();
}

function renderReports(){
 const days=Number($('repRange').value);
 const from=days?new Date(new Date().setHours(0,0,0,0)-(days-1)*864e5):null;
 const f=a=>from?a.filter(x=>x.date&&new Date(x.date)>=from):a;
 const s=a=>a.reduce((n,x)=>n+x.amount,0);

 const S=f(data.sales);
 const E=f(data.expenses);
 const confirmedDebts=data.debts.filter(d=>d.status==='confirmed'||d.status==='paid');
 const confirmedIds=new Set(confirmedDebts.map(d=>d.id));
 const confirmedPayments=data.payments.filter(p=>confirmedIds.has(p.debtId));
 const P=f(confirmedPayments);

 const sales=s(S);
 const exp=s(E);
 const paid=s(P);
 const debt=confirmedDebts.reduce((n,d)=>n+remaining(d),0);
 const cashIn=s(S.filter(x=>x.type!=='qarz'));
 const real=S.filter(x=>x.pid).reduce((n,x)=>n+x.amount-x.cost,0);
 const stock=data.products.reduce((n,p)=>n+(p.price-p.cost)*p.quantity,0);
 const st=(k,v)=>`<div class="stat"><span>${t(k)}</span><b>${money(v)}</b></div>`;

 $('reportContent').innerHTML=`
  <div class="stats">
   ${st('totSales',sales)}
   ${st('expenses',exp)}
   ${st('debtLeft',debt)}
   ${st('paidDebt',paid)}
   ${st('netCash',cashIn+paid-exp)}
   ${st('realProfit',real)}
   ${st('stockProfit',stock)}
  </div>
  <p class="small">${t('repNote')}</p>
 `;
}

async function loadBuyerDebts(){
 if(!user)return;
 try{
  const {error:claimError}=await db.rpc('claim_my_debts');
  if(claimError)throw claimError;

  const {data:r,error}=await db.from('debts')
   .select('*').eq('buyer_id',user.id)
   .order('created_at',{ascending:false});
  if(error)throw error;

  const ds=r||[];
  const ids=ds.map(d=>d.id);
  let ps=[],debtHistory=[];
  let shopIds=[...new Set(ds.map(d=>d.shop_id).filter(Boolean))];
  let shopsById={};

  if(shopIds.length){
   const sr=await db.from('shops').select('id,name,shop_name').in('id',shopIds);
   if(!sr.error)(sr.data||[]).forEach(s=>shopsById[s.id]=s);
  }

  if(ids.length){
   const [p,h]=await Promise.all([
    db.from('payments').select('*').in('debt_id',ids).order('created_at',{ascending:false}),
    db.from('debt_history').select('debt_id,action,old_data,new_data,created_at').in('debt_id',ids).order('created_at',{ascending:false})
   ]);
   if(p.error)throw p.error;
   if(h.error)throw h.error;
   ps=p.data;debtHistory=h.data||[];
  }

  list('buyerDebtsList',ds,d=>{
   const paid=ps.filter(p=>p.debt_id===d.id)
    .reduce((s,p)=>s+Number(p.amount),0);
   const left=Math.max(0,Number(d.amount)-paid);
   const st=d.status||'pending';
   const pend=st==='pending';
   const sh=shopsById[d.shop_id];
   const shopTitle=sh?(sh.shop_name||sh.name):'';
   const history=ps.filter(p=>p.debt_id===d.id);
   const changes=debtHistory.filter(h=>h.debt_id===d.id);

   return `
    <div class="item">
     <b>${t('debtRec')}</b>
     ${shopTitle?`<div>${esc(shopTitle)}</div>`:''}
     <div>${t('debt')}: ${money(d.amount)}</div>
     <div>${t('paidL')}: ${money(paid)}</div>
     <b>${t('leftL')}: ${money(left)}</b>
     <div><span class="tag">${esc(statusText(st))}</span></div>
     <div class="small">${t('dueL')}: ${esc(d.due_date||t('unset'))}</div>
     ${d.note?`<div class="small">${esc(d.note)}</div>`:''}
     ${history.length?`<div class="small">${t('payments')}: ${history.map(p=>money(p.amount)+' · '+new Date(p.paid_at||p.created_at).toLocaleDateString(loc())).join(' | ')}</div>`:''}
     ${changes.length?`<div class="small"><b>${t('historyTitle')}:</b> ${changes.map(h=>esc(debtHistoryText(h))+' · '+new Date(h.created_at).toLocaleDateString(loc())).join(' | ')}</div>`:''}
     ${d.buyer_response_note?`<div class="small">${t('objNote')}: ${esc(d.buyer_response_note)}</div>`:''}
     ${pend?`
      <label>${t('reason')}</label>
      <textarea id="note-${esc(d.id)}" rows="2" placeholder="${t('whyNot')}"></textarea>
      <div class="row">
       <button class="good" onclick="respondDebt('${esc(d.id)}','confirmed')">${t('bConfirm')}</button>
       <button class="danger" onclick="respondDebt('${esc(d.id)}','disputed')">${t('bDispute')}</button>
      </div>
     `:''}
    </div>
   `;
  });

  await loadNotifications();
 }catch(e){
  say('loadFail',eT(e));
 }
}

async function respondDebt(id,status){
 try{
  const note=$('note-'+id)?.value.trim()||null;
  if(status==='disputed'&&!note&&!confirm(t('noReasonQ')))return;

  const {error}=await db.rpc('buyer_respond_to_debt',{
   p_debt_id:id,p_status:status,p_note:note
  });
  if(error)throw error;

  alert(t(status==='confirmed'?'okConfirm':'okDispute'));
  await loadBuyerDebts();
  await loadNotifications();
 }catch(e){
  alert(t('respFail')+eT(e));
 }
}
