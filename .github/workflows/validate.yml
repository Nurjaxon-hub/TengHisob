name: TengHisob validation

on:
  push:
    branches: [main]
    paths-ignore:
      - 'package.json'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Repositoryni yuklash
        uses: actions/checkout@v4

      - name: Node.js 20 ni sozlash
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bog'liqliklarni tekshirib o'rnatish
        run: npm ci

      - name: Service Worker sintaksisini tekshirish
        run: node --check sw.js

      - name: HTML ichidagi JavaScript sintaksisini tekshirish
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';

          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(([, attributes, body]) => !/\bsrc\s*=/.test(attributes) && body.trim());

          if (!scripts.length) throw new Error('Inline JavaScript topilmadi');

          for (const [, , body] of scripts) {
            const result = spawnSync(process.execPath, ['--check', '-'], {
              input: body,
              encoding: 'utf8'
            });
            if (result.status !== 0) {
              process.stderr.write(result.stderr || 'JavaScript sintaksis xatosi');
              process.exit(result.status ?? 1);
            }
          }
          console.log('Inline JavaScript sintaksisi to‘g‘ri.');
          NODE

      - name: Kutubxonalar xavfsizligi hisobotini olish
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          console.log('Zaifliklar soni:', JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              range: item.range,
              direct: item.isDirect,
              fixAvailable: item.fixAvailable
            }));
          }
          NODE

      - name: Web ilovani yig'ish
        run: npm run build:web

      - name: Yig'ilgan fayllarni tekshirish
        run: |
          test -s www/index.html
          test -s www/style.css
          test -s www/sw.js
          test -s www/manifest.json
          test -s www/icon.svg
