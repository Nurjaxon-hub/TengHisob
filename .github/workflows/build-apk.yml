name: Build TengHisob APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "style.css"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "manifest.json"
      - "sw.js"
      - "icon.svg"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check project files
        run: |
          test -f index.html
          test -f style.css
          test -f manifest.json
          test -f sw.js
          test -f icon.svg
          test -f package.json
          test -f capacitor.config.json

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Save package-lock.json to GitHub
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Generate package-lock.json"
            git push
          fi

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html style.css manifest.json sw.js icon.svg www/

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: TengHisob-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14