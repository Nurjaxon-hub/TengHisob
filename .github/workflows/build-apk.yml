
name: Build TengHisob APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "style.css"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "manifest.json"
      - "sw.js"
      - "icon.svg"
      - "icon-192.png"
      - "icon-512.png"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check project files
        run: |
          test -f index.html
          test -f package.json
          test -f capacitor.config.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/

          for file in style.css manifest.json sw.js icon.svg icon-192.png icon-512.png; do
            if [ -f "$file" ]; then
              cp "$file" www/
            fi
          done

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: TengHisob-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
