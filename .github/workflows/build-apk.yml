name: Build TengHisob APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "style.css"
      - "package-lock.json"
      - "capacitor.config.json"
      - "manifest.json"
      - "sw.js"
      - "icon.svg"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check project files
        run: |
          test -f index.html
          test -f style.css
          test -f manifest.json
          test -f sw.js
          test -f icon.svg
          test -f package.json
          test -f package-lock.json
          test -f capacitor.config.json

      - name: Validate inline JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const blocks = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(([, attrs, code]) => !/\bsrc\s*=/.test(attrs) && code.trim());
          if (!blocks.length) throw new Error('Inline JavaScript block not found');
          for (let i = 0; i < blocks.length; i++) {
            try {
              new Function(blocks[i][2]);
            } catch (error) {
              console.error('Inline script ' + (i + 1) + ':', error);
              process.exitCode = 1;
            }
          }
          if (process.exitCode) process.exit(1);
          console.log('Validated ' + blocks.length + ' inline JavaScript block(s).');
          NODE

      - name: Validate app markup
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(x => x[1]);
          const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
          const dict = html.match(/const L=\{([\s\S]*?)\n\};/);
          if (!dict) throw new Error('Translation dictionary not found');
          const keys = new Set([...dict[1].matchAll(/^\s*([A-Za-z_$][\w$]*)\s*:/gm)].map(x => x[1]));
          const labels = [...html.matchAll(/data-[ip]="([^"]+)"/g)].map(x => x[1]);
          const missingLabels = [...new Set(labels.filter(key => !keys.has(key)))];
          const refs = [...html.matchAll(/\$\(['"]([^'"]+)['"]\)/g)].map(x => x[1]);
          const missingRefs = [...new Set(refs.filter(id => !ids.includes(id)))];
          const required = ['auth','app','shop','buyer','catalog','shopAppeals','sales','debts','payments','reports'];
          const missingRequired = required.filter(id => !ids.includes(id));
          if (duplicates.length || missingLabels.length || missingRefs.length || missingRequired.length) {
            throw new Error(JSON.stringify({duplicates, missingLabels, missingRefs, missingRequired}));
          }
          console.log('Markup checks passed: unique IDs, translations, and element references.');
          NODE

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare web files
        run: npm run build:web

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name APK file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TengHisob.apk

      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TengHisob-APK
          path: TengHisob.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TengHisob APK (latest)
          body: |
            TengHisob Android ilovasining oxirgi yig‘ilgan APK fayli.
            Yuklab olish uchun TengHisob.apk faylini tanlang.
          files: TengHisob.apk
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
